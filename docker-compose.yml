services:
  db:
    image: postgres:16-alpine
    container_name: jobtime-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: jobtime
      POSTGRES_PASSWORD: jobtime
      POSTGRES_DB: jobtime
    volumes:
      - jobtime_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobtime -d jobtime']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobtime_pgdata:
